<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>javaxa</title>
  
  <!-- Modern GUI Fonts: Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body class="loading">

    <!-- Background 4K Image -->
    <div class="bg-image"></div>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="spinner-wrapper">
      <div class="spinner-ring"></div>
      <div class="spinner-core"></div>
    </div>
    <div class="loader-text">Loading...</div>
  </div>

  <!-- Ambient Glow Effects -->
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>


  <main class="container">
    <!-- Profile Header -->
    <header class="profile">
    <div class="avatar-container">
        <!-- Replace 'profile.jpg' with your image file name -->
        <img src="pfp.jpg" alt="javaxa" class="avatar-img" />
    </div>
    <h1 class="username">@javaxa</h1>
    <p class="bio">young gamer/creator</p>
    </header>

    <!-- Social Links Stack -->
    <section class="links-stack">
      
      <!-- Instagram Link -->
      <a href="https://instagram.com/jaavaxaa/" target="_blank" class="link-card instagram">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </div>
        <span class="link-title">Instagram</span>
        <div class="arrow-icon">→</div>
      </a>

      <!-- YouTube Link -->
      <a href="https://youtube.com/@javaaxa" target="_blank" class="link-card youtube">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
          </svg>
        </div>
        <span class="link-title">YouTube</span>
        <div class="arrow-icon">→</div>
      </a>

      <!-- TikTok Link -->
      <a href="https://tiktok.com/@javaaxa" target="_blank" class="link-card tiktok">
        <div class="link-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68 6.34 6.34 0 0 0 9.34 22a6.34 6.34 0 0 0 6.34-6.32V9.05a8.16 8.16 0 0 0 4.91 1.62V7.22a4.85 4.85 0 0 1-1-.53z"/>
          </svg>
        </div>
        <span class="link-title">TikTok</span>
        <div class="arrow-icon">→</div>
      </a>

    </section>

    <footer>
      <p>© javaxa • All Rights Reserved</p>
    </footer>
  </main>

  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      setTimeout(() => {
        loader.classList.add('hidden');
        document.body.classList.remove('loading');
      }, 500);
    });
  </script>
</body>
</html>
